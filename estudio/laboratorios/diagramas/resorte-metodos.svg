<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Dos formas de medir la constante de un resorte</title>
  <desc id="desc">Método estático: comparar la posición sin carga con la posición de equilibrio y medir el alargamiento x. Sobre la masa actúan una fuerza elástica hacia arriba y el peso hacia abajo. Método dinámico: medir el tiempo de oscilaciones alrededor del equilibrio; la amplitud A se mide desde ese equilibrio. El período T es el tiempo de un ciclo completo.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto-start-reverse"><path d="M0 0 8 4 0 8Z" fill="context-stroke"/></marker>
    <pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M0 10 10 0" stroke="#94a3b8" stroke-width="1.5"/></pattern>
    <style>
      text{font-family:'Segoe UI',Arial,sans-serif;fill:#172b43}
      .heading{font-size:23px;font-weight:700}.label{font-size:18px}.small{font-size:16px;fill:#475569}
      .math{font-family:'Cambria Math',Georgia,serif;font-size:25px}
      .spring{fill:none;stroke:#334155;stroke-width:4;stroke-linejoin:round}
      .guide{stroke:#94a3b8;stroke-width:1.5;stroke-dasharray:6 5}
      .mass{fill:#e0edff;stroke:#2457a7;stroke-width:2}
    </style>
  </defs>
  <rect width="1200" height="760" rx="20" fill="#f5f7fb"/>
  <text x="40" y="48" font-size="28" font-weight="700">Un resorte · dos métodos · la misma constante k</text>
  <text x="40" y="78" class="small">Qué medir en el laboratorio y desde dónde medirlo. Esquema ideal, sin escala.</text>
  <rect x="28" y="104" width="560" height="546" rx="16" fill="white" stroke="#d8e0eb"/>
  <rect x="612" y="104" width="560" height="546" rx="16" fill="white" stroke="#d8e0eb"/>
  <text x="52" y="141" class="heading">01 / ESTÁTICO</text>
  <text x="52" y="169" class="small">Colgar una masa → esperar → medir x</text>
  <text x="636" y="141" class="heading">02 / DINÁMICO</text>
  <text x="636" y="169" class="small">Separar del equilibrio → soltar → medir t</text>

  <text x="95" y="205" class="label">Sin carga</text>
  <text x="294" y="205" class="label">En equilibrio</text>
  <path d="M88 220H422" stroke="#334155" stroke-width="5"/>
  <rect x="88" y="208" width="334" height="10" fill="url(#hatch)"/>
  <path class="spring" d="M148 220V239L134 246 162 259 134 272 162 285 134 298 162 311 148 318V334"/>
  <circle cx="148" cy="337" r="4" fill="#334155"/>
  <path class="spring" d="M346 220V243L331 254 361 276 331 298 361 320 331 342 361 364 346 375V410"/>
  <path class="guide" d="M120 337H529M312 410H529"/>
  <rect class="mass" x="312" y="410" width="68" height="62" rx="8"/>
  <text x="346" y="449" text-anchor="middle" class="math">m</text>
  <path d="M346 409V347" stroke="#176b56" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="383" y="373" class="label" fill="#176b56">Fₑ = kx</text>
  <path d="M346 473V535" stroke="#a63c36" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="382" y="514" class="label">P = mg</text>
  <path d="M501 341V406" stroke="#2457a7" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="514" y="396" class="math">x</text>
  <text x="68" y="365" class="small">Referencia inicial x₀</text>
  <text x="68" y="434" class="small">Referencia final</text>
  <rect x="52" y="561" width="512" height="66" rx="10" fill="#edf4ff"/>
  <text x="72" y="589" class="math">kx = mg → k = mg / x</text>
  <text x="72" y="614" class="small">x = alargamiento respecto de la referencia inicial</text>

  <path d="M650 220H825" stroke="#334155" stroke-width="5"/>
  <rect x="650" y="208" width="175" height="10" fill="url(#hatch)"/>
  <path class="spring" d="M716 220V243L701 254 731 276 701 298 731 320 701 342 731 364 716 375V391"/>
  <rect x="686" y="306" width="60" height="58" rx="8" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="5 4"/>
  <rect class="mass" x="686" y="391" width="60" height="58" rx="8"/>
  <text x="716" y="428" text-anchor="middle" class="math">m</text>
  <rect x="686" y="476" width="60" height="58" rx="8" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="5 4"/>
  <path class="guide" d="M650 335H850M650 420H850M650 505H850"/>
  <path d="M778 339V416" stroke="#2457a7" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="790" y="382" class="math">A</text>
  <text x="651" y="552" class="small">A: amplitud desde el equilibrio</text>

  <text x="878" y="236" class="label">Desplazamiento y</text>
  <text x="878" y="260" class="small">respecto del equilibrio</text>
  <path d="M886 503V295M875 420H1138" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="1134" y="446" class="label">t</text>
  <text x="872" y="415" text-anchor="end" class="small">0</text>
  <path d="M896 335C925 335 925 505 954 505S983 335 1012 335 1041 505 1070 505 1099 335 1128 335" fill="none" stroke="#2457a7" stroke-width="3"/>
  <path class="guide" d="M896 335V290M1012 335V290"/>
  <path d="M900 294H1008" stroke="#176b56" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="954" y="282" text-anchor="middle" class="math">T</text>
  <text x="878" y="543" class="small">1 ciclo: misma posición</text>
  <text x="878" y="565" class="small">y mismo sentido de movimiento</text>
  <rect x="636" y="581" width="512" height="46" rx="10" fill="#edf4ff"/>
  <text x="656" y="612" class="math">T = t / N → k = 4π²m / T² *</text>

  <text x="40" y="688" class="label" font-weight="600">No confundir: x estira el resorte · A mide la oscilación alrededor del equilibrio.</text>
  <text x="40" y="720" class="small">* Si la masa del resorte importa, reemplazar m por m + mᵣ/3. Ver el criterio en la guía.</text>
</svg>
