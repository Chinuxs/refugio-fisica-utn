<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="580" viewBox="0 0 1080 580" role="img" aria-labelledby="title desc">
<title id="title">Centro de masa: posición y referencia</title><desc id="desc">Ejemplo del TP 8 ejercicio 8: masas de 2 y 4 kg en x=3 y x=6 m dan centro de masa en x=5 m. Ejercicio 12: masas de 3 y 7 gramos con velocidades 3 y 0 m/s tienen CM a 0,9 m/s; velocidades relativas 2,1 y menos 0,9 m/s.</desc>
<defs>
<marker id="a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#b9c7da"/></marker>
<marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#79b7ff"/></marker>
<marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#ffce75"/></marker>
<marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#79dfba"/></marker>
<marker id="a4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#ff96ab"/></marker>
<marker id="a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#f4f7fc"/></marker>
<pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M0 10 L10 0" stroke="#79b7ff" stroke-width="1" opacity="0.3"/></pattern>
<style>text{font-family:Inter,"Segoe UI",Arial,sans-serif}.eq{font-family:"Cambria Math","STIX Two Math",Georgia,serif}</style></defs>
<rect x="12" y="12" width="1056" height="556" rx="24" fill="#141b25" stroke="#45556b"/>
<text x="42" y="57" font-size="29" fill="#f4f7fc" text-anchor="start" font-weight="700">Centro de masa: posición y referencia</text>
<text x="42" y="90" font-size="19" fill="#b9c7da" text-anchor="start">Promedio ponderado por las masas; restar la velocidad del CM para cambiar de referencia.</text>
<rect x="42" y="126" width="478" height="351" rx="16" fill="#202a38"/>
<text x="62" y="162" font-size="21" fill="#f4f7fc" text-anchor="start" font-weight="700">POSICIÓN · TP 8, EJ. 8</text>
<line x1="90" y1="322" x2="483" y2="322" stroke="#b9c7da" stroke-width="2" marker-end="url(#a0)"/>
<line x1="140" y1="311" x2="140" y2="333" stroke="#b9c7da" stroke-width="2"/>
<text x="140" y="364" font-size="20" fill="#b9c7da" text-anchor="middle">3 m</text>
<line x1="340" y1="311" x2="340" y2="333" stroke="#b9c7da" stroke-width="2"/>
<text x="340" y="364" font-size="20" fill="#b9c7da" text-anchor="middle">5 m</text>
<line x1="440" y1="311" x2="440" y2="333" stroke="#b9c7da" stroke-width="2"/>
<text x="440" y="364" font-size="20" fill="#b9c7da" text-anchor="middle">6 m</text>
<circle cx="140" cy="277" r="19" fill="#79b7ff"/>
<circle cx="440" cy="277" r="28" fill="#ffce75"/>
<text x="140" y="238" font-size="22" fill="#79b7ff" text-anchor="middle">2 kg</text>
<text x="440" y="231" font-size="22" fill="#ffce75" text-anchor="middle">4 kg</text>
<path d="M340 259 L353 277 L340 295 L327 277 Z" stroke="#79dfba" stroke-width="2" fill="none"/>
<text x="340" y="238" font-size="22" fill="#79dfba" text-anchor="middle" font-weight="700">CM</text>
<line x1="340" y1="294" x2="340" y2="311" stroke="#79dfba" stroke-width="2" stroke-dasharray="4 4"/>
<text x="278" y="427" font-size="25" fill="#f4f7fc" text-anchor="middle" class="eq">xCM = (2·3 + 4·6)/6 = 5 m</text>
<rect x="540" y="126" width="498" height="351" rx="16" fill="#202a38"/>
<text x="560" y="162" font-size="21" fill="#f4f7fc" text-anchor="start" font-weight="700">VELOCIDAD · TP 8, EJ. 12</text>
<text x="562" y="207" font-size="22" fill="#b9c7da" text-anchor="start">Suelo: 3 g a 3 m/s; 7 g en reposo.</text>
<text x="562" y="253" font-size="24" fill="#79dfba" text-anchor="start" class="eq">vCM = (3·3 + 7·0)/10 = 0,9 m/s</text>
<text x="562" y="312" font-size="21" fill="#b9c7da" text-anchor="start">Desde el CM:</text>
<text x="562" y="354" font-size="25" fill="#79b7ff" text-anchor="start" class="eq">v′₁ = 3 − 0,9 = +2,1 m/s</text>
<text x="562" y="399" font-size="25" fill="#ffce75" text-anchor="start" class="eq">v′₂ = 0 − 0,9 = −0,9 m/s</text>
<text x="562" y="450" font-size="22" fill="#f4f7fc" text-anchor="start">En esta referencia: Σmᵢv′ᵢ = 0.</text>
<text x="42" y="545" font-size="19" fill="#b9c7da" text-anchor="start">El CM está más cerca de la masa mayor. Momento total cero no significa que cada partícula esté quieta.</text>
</svg>
