<line x1="791" y1="291" x2="783" y2="301" stroke="#ffce75" stroke-width="2"/>
<line x1="806" y1="291" x2="798" y2="301" stroke="#ffce75" stroke-width="2"/>
<line x1="821" y1="291" x2="813" y2="301" stroke="#ffce75" stroke-width="2"/>
<line x1="836" y1="291" x2="828" y2="301" stroke="#ffce75" stroke-width="2"/>
<line x1="851" y1="291" x2="843" y2="301" stroke="#ffce75" stroke-width="2"/>
<line x1="866" y1="291" x2="858" y2="301" stroke="#ffce75" stroke-width="2"/>
<line x1="881" y1="291" x2="873" y2="301" stroke="#ffce75" stroke-width="2"/>
<line x1="896" y1="291" x2="888" y2="301" stroke="#ffce75" stroke-width="2"/>
<line x1="911" y1="291" x2="903" y2="301" stroke="#ffce75" stroke-width="2"/>
<line x1="926" y1="291" x2="918" y2="301" stroke="#ffce75" stroke-width="2"/>
<line x1="941" y1="291" x2="933" y2="301" stroke="#ffce75" stroke-width="2"/>
<line x1="956" y1="291" x2="948" y2="301" stroke="#ffce75" stroke-width="2"/>
<line x1="971" y1="291" x2="963" y2="301" stroke="#ffce75" stroke-width="2"/>
<line x1="986" y1="291" x2="978" y2="301" stroke="#ffce75" stroke-width="2"/>
<line x1="1001" y1="291" x2="993" y2="301" stroke="#ffce75" stroke-width="2"/>
<line x1="746" y1="340" x2="976" y2="340" stroke="#ffce75" stroke-width="2" marker-end="url(#a2)"/>
<text x="849" y="367" font-size="21" fill="#ffce75" text-anchor="start">d</text>
<text x="736" y="400" font-size="21" fill="#b9c7da" text-anchor="start">Roce → cambio de K:</text>
<text x="736" y="440" font-size="28" fill="#f4f7fc" text-anchor="start" class="eq">½V² = μₖgd</text>
<line x1="736" y1="287" x2="1016" y2="287" stroke="#b9c7da" stroke-width="2"/>
<text x="540" y="528" font-size="23" fill="#f4f7fc" text-anchor="middle">Resolver hacia atrás: frenado → V; después, choque → v del proyectil.</text>
<text x="42" y="555" font-size="19" fill="#b9c7da" text-anchor="start">El roce es despreciable sólo durante el impacto corto. En el frenado, su trabajo es esencial.</text>
</svg>
