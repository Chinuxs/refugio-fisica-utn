<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Estática y rototraslación: qué fuerzas y movimientos analizar</title>
  <desc id="desc">Izquierda: escalera uniforme sobre piso rugoso y pared lisa. Peso vertical por el centro, normal del piso hacia arriba, normal de la pared hacia la izquierda y rozamiento del piso hacia la derecha. Derecha: rueda que avanza hacia la derecha sin deslizar; su centro tiene velocidad v, el punto superior 2v y el contacto velocidad cero. El giro es horario.</desc>
  <rect width="1200" height="520" rx="18" fill="#f5f7fb"/>
  <g font-family="Segoe UI,Arial,sans-serif" fill="#172b43">
    <text x="28" y="42" font-size="26" font-weight="700">Equilibrar fuerzas y torques · combinar traslación y giro</text>
    <text x="28" y="72" font-size="16">Dos modelos del TP 10. Esquemas ideales, sin escala; la rueda se observa desde un suelo fijo.</text>
    <rect x="20" y="96" width="562" height="403" rx="14" fill="white" stroke="#d8e0eb"/>
    <rect x="602" y="96" width="578" height="403" rx="14" fill="white" stroke="#d8e0eb"/>
    <text x="42" y="135" font-size="22" font-weight="700">01 / ESCALERA EN EQUILIBRIO</text>
    <text x="624" y="135" font-size="22" font-weight="700">02 / RODADURA SIN DESLIZAR</text>
    <text x="42" y="164" font-size="16">Pared lisa · piso rugoso · peso propio</text>
    <text x="624" y="164" font-size="16">El centro avanza y la rueda gira en sentido horario</text>

