<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="580" viewBox="0 0 1080 580" role="img" aria-labelledby="title desc">
<title id="title">Loop: llegar arriba manteniendo contacto</title><desc id="desc">En la cima del loop la normal y el peso apuntan hacia el centro. El límite es normal cero y velocidad al cuadrado igual a gR. La energía inicial mínima es cinco medios de mgR.</desc>
<defs>
<marker id="a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#b9c7da"/></marker>
<marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#79b7ff"/></marker>
<marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#ffce75"/></marker>
<marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#79dfba"/></marker>
<marker id="a4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#ff96ab"/></marker>
<marker id="a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#f4f7fc"/></marker>
<pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M0 10 L10 0" stroke="#79b7ff" stroke-width="1" opacity="0.3"/></pattern>
<style>text{font-family:Inter,"Segoe UI",Arial,sans-serif}.eq{font-family:"Cambria Math","STIX Two Math",Georgia,serif}</style></defs>
<rect x="12" y="12" width="1056" height="556" rx="24" fill="#141b25" stroke="#45556b"/>
<text x="42" y="57" font-size="29" fill="#f4f7fc" text-anchor="start" font-weight="700">Loop: llegar arriba manteniendo contacto</text>
<text x="42" y="90" font-size="19" fill="#b9c7da" text-anchor="start">Cuerpo por dentro de una pista circular lisa; el resorte parte a la altura de la base.</text>
<rect x="42" y="126" width="460" height="369" rx="16" fill="#202a38"/>
<text x="62" y="162" font-size="21" fill="#f4f7fc" text-anchor="start" font-weight="700">1 · CONTACTO EN LA CIMA</text>
<circle cx="270" cy="324" r="119" fill="none" stroke="#b9c7da" stroke-width="2"/>
<circle cx="270" cy="324" r="5" fill="#f4f7fc"/>
<circle cx="270" cy="205" r="14" fill="#79b7ff"/>
<line x1="259" y1="220" x2="259" y2="288" stroke="#79b7ff" stroke-width="3" marker-end="url(#a1)"/>
<line x1="283" y1="220" x2="283" y2="302" stroke="#ffce75" stroke-width="3" marker-end="url(#a2)"/>
<text x="224" y="265" font-size="22" fill="#79b7ff" text-anchor="start">N</text>
<text x="303" y="286" font-size="22" fill="#ffce75" text-anchor="start">mg</text>
<line x1="285" y1="201" x2="380" y2="201" stroke="#79dfba" stroke-width="3" marker-end="url(#a3)"/>
<text x="369" y="182" font-size="22" fill="#79dfba" text-anchor="start">v</text>
<line x1="277" y1="324" x2="383" y2="324" stroke="#b9c7da" stroke-width="2" stroke-dasharray="5 5"/>
<text x="324" y="348" font-size="20" fill="#b9c7da" text-anchor="start">R</text>
<text x="270" y="477" font-size="27" fill="#f4f7fc" text-anchor="middle" class="eq">N + mg = mv²/R</text>
<rect x="522" y="126" width="516" height="369" rx="16" fill="#202a38"/>
<text x="542" y="162" font-size="21" fill="#f4f7fc" text-anchor="start" font-weight="700">2 · ENERGÍA DESDE LA BASE</text>
<text x="550" y="206" font-size="23" fill="#b9c7da" text-anchor="start">En el límite de contacto:</text>
<text x="550" y="248" font-size="28" fill="#79b7ff" text-anchor="start" class="eq">N = 0  →  v²cima = gR</text>
<text x="550" y="306" font-size="28" fill="#f4f7fc" text-anchor="start" class="eq">½kx² = mg(2R) + ½m(gR)</text>
<text x="550" y="344" font-size="19" fill="#b9c7da" text-anchor="start">altura ganada      +      K en la cima</text>
<rect x="548" y="380" width="463" height="75" rx="12" fill="#22394b"/>
<text x="780" y="429" font-size="32" fill="#79dfba" text-anchor="middle" class="eq">xmín = √(5mgR/k)</text>
<text x="42" y="545" font-size="19" fill="#b9c7da" text-anchor="start">Poner v = 0 arriba no alcanza. Con pérdidas, hace falta más energía inicial.</text>
</svg>
