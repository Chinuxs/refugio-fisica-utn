<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="570" viewBox="0 0 1080 570" role="img" aria-labelledby="title desc">
<title id="title">Trabajo: proyección y área con signo</title><desc id="desc">A la izquierda una fuerza inclinada actúa sobre un bloque que se desplaza a la derecha. A la derecha un gráfico ilustrativo de fuerza en función de posición tiene áreas positivas y negativas.</desc>
<defs>
<marker id="a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#b9c7da"/></marker>
<marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#79b7ff"/></marker>
<marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#ffce75"/></marker>
<marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#79dfba"/></marker>
<marker id="a4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#ff96ab"/></marker>
<marker id="a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#f4f7fc"/></marker>
<pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M0 10 L10 0" stroke="#79b7ff" stroke-width="1" opacity="0.3"/></pattern>
<style>text{font-family:Inter,"Segoe UI",Arial,sans-serif}.eq{font-family:"Cambria Math","STIX Two Math",Georgia,serif}</style></defs>
<rect x="12" y="12" width="1056" height="546" rx="24" fill="#141b25" stroke="#45556b"/>
<text x="42" y="57" font-size="29" fill="#f4f7fc" text-anchor="start" font-weight="700">Trabajo: proyección y área con signo</text>
<text x="42" y="90" font-size="19" fill="#b9c7da" text-anchor="start">Dos lecturas del mismo concepto: fuerza durante un desplazamiento.</text>
<rect x="42" y="126" width="478" height="366" rx="16" fill="#202a38"/>
<text x="62" y="162" font-size="21" fill="#f4f7fc" text-anchor="start" font-weight="700">FUERZA CONSTANTE</text>
<rect x="153" y="289" width="60" height="44" rx="7" fill="#202a38" stroke="#79b7ff"/>
<text x="183.0" y="318.0" font-size="22" fill="#79b7ff" text-anchor="middle" font-weight="700">m</text>
<line x1="83" y1="335" x2="480" y2="335" stroke="#b9c7da" stroke-width="3"/>
<line x1="183" y1="311" x2="389" y2="195" stroke="#79b7ff" stroke-width="4" marker-end="url(#a1)"/>
<line x1="183" y1="311" x2="389" y2="311" stroke="#b9c7da" stroke-width="2" stroke-dasharray="6 6"/>
<line x1="389" y1="195" x2="389" y2="311" stroke="#b9c7da" stroke-width="2" stroke-dasharray="6 6"/>
<path d="M248 311 A65 65 0 0 0 240 279" stroke="#ffce75" stroke-width="3" fill="none"/>
<text x="253" y="292" font-size="23" fill="#ffce75" text-anchor="start">θ</text>
<text x="372" y="179" font-size="24" fill="#79b7ff" text-anchor="start" font-weight="700">F</text>
<text x="298" y="301" font-size="20" fill="#b9c7da" text-anchor="start" class="eq">F cos θ</text>
<line x1="153" y1="376" x2="397" y2="376" stroke="#79dfba" stroke-width="3" marker-end="url(#a3)"/>
<text x="266" y="409" font-size="23" fill="#79dfba" text-anchor="start">d</text>
<text x="280" y="462" font-size="28" fill="#f4f7fc" text-anchor="middle" class="eq">W = Fd cos θ</text>
<rect x="540" y="126" width="498" height="366" rx="16" fill="#202a38"/>
<text x="560" y="162" font-size="21" fill="#f4f7fc" text-anchor="start" font-weight="700">FUERZA VARIABLE · gráfico ilustrativo</text>
<path d="M606 327 L766 187 L846 327 Z" stroke="#79b7ff" stroke-width="2" fill="#233e5e"/>
<path d="M846 327 L926 397 L966 327 Z" stroke="#ff96ab" stroke-width="2" fill="#492e40"/>
<line x1="595" y1="327" x2="993" y2="327" stroke="#b9c7da" stroke-width="2" marker-end="url(#a0)"/>
<line x1="606" y1="418" x2="606" y2="167" stroke="#b9c7da" stroke-width="2" marker-end="url(#a0)"/>
<text x="575" y="201" font-size="22" fill="#b9c7da" text-anchor="start">Fₓ</text>
<text x="985" y="356" font-size="21" fill="#b9c7da" text-anchor="start">x</text>
<text x="588" y="353" font-size="18" fill="#b9c7da" text-anchor="start">0</text>
<text x="721" y="287" font-size="22" fill="#79b7ff" text-anchor="start">+ área</text>
<text x="870" y="369" font-size="20" fill="#ff96ab" text-anchor="start">− área</text>
<text x="788" y="462" font-size="28" fill="#f4f7fc" text-anchor="middle" class="eq">W = ∫ Fₓ dx</text>
<text x="42" y="535" font-size="19" fill="#b9c7da" text-anchor="start">La proyección decide el signo. En el gráfico se suman áreas algebraicas; el resultado es trabajo.</text>
</svg>
