<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="650" viewBox="0 0 1080 650" role="img" aria-labelledby="title desc">
<title id="title">De altura a resorte: seguir la energía</title><desc id="desc">Un bloque de 10 kg baja desde 3 metros. Sólo el tramo BC es rugoso. Termina comprimiendo 0,30 m un resorte de 2250 N/m. Energía inicial 294 J, final 101,25 J y 192,75 J transformados en energía interna.</desc>
