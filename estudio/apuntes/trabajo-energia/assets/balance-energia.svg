<text x="62" y="459" font-size="21" fill="#f4f7fc" text-anchor="start" font-weight="700">INICIO · Eᵢ = mgh = 294 J</text>
<rect x="65" y="480" width="420" height="25" rx="4" fill="#ffce75"/>
<text x="65" y="546" font-size="20" fill="#b9c7da" text-anchor="start">Toda la energía mecánica está en Uɡ.</text>
<rect x="540" y="423" width="498" height="166" rx="16" fill="#202a38"/>
<text x="560" y="459" font-size="21" fill="#f4f7fc" text-anchor="start" font-weight="700">FINAL · E𝒇 = ½kx² = 101,25 J</text>
<rect x="563" y="480" width="145" height="25" rx="4" fill="#79dfba"/>
<rect x="708" y="480" width="276" height="25" rx="4" fill="url(#hatch)" stroke="#79b7ff"/>
<text x="563" y="540" font-size="20" fill="#79dfba" text-anchor="start">Uₑ = 101,25 J</text>
<text x="563" y="572" font-size="20" fill="#79b7ff" text-anchor="start">192,75 J → energía interna</text>
<text x="42" y="615" font-size="19" fill="#b9c7da" text-anchor="start">Wroce = E𝒇 − Eᵢ = −192,75 J. La energía total se conserva; la mecánica disminuye.</text>
