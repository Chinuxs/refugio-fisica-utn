<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="650" viewBox="0 0 1080 650" role="img" aria-labelledby="title desc">
<title id="title">Trabajo y Energía · elegir el método</title><desc id="desc">Diagrama de decisiones. F y desplazamiento: Wneto = ΔK; Constante o gráfico Fₓ(x). Alturas, resortes o roce: Eᵢ + Wnc = E𝒇; Fijar h = 0 y deformaciones. Pista con varios sectores: Un balance por tramo; Separar superficies lisas y rugosas. Loop y condición de contacto: Energía + ΣF radial = mv²/R; La rapidez sola no garantiza contacto. Motor, tiempo o caudal: Potencia = W/Δt o F · v; Distinguir media e instantánea</desc>
