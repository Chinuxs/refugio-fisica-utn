<title id="title">Posición, velocidad y aceleración en un período</title><desc id="desc">Tres curvas normalizadas: posición seno, velocidad coseno y aceleración menos seno. En T/4 la posición es A, velocidad cero y aceleración mínima; en 3T/4 sucede lo opuesto.</desc>
