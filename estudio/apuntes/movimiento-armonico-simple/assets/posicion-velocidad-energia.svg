<title id="title">MAS: qué pasa en cada posición</title><desc id="desc">En menos A y más A la velocidad es cero y la aceleración máxima apunta al equilibrio. Al pasar por cero la rapidez es máxima y la aceleración nula. Se comparan barras de energía cinética y potencial.</desc>
