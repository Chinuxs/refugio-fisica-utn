<svg xmlns="http://www.w3.org/2000/svg" width="920" height="730" viewBox="0 0 920 730" role="img" aria-labelledby="title description">
  <title id="title">División miembro a miembro y cancelación de factores no nulos</title>
  <desc id="description">Se divide T seno theta igual a ma por T coseno theta igual a mg. Las dos T y las dos m se tachan como factores comunes no nulos. Queda seno theta sobre coseno theta igual a a sobre g, y por la definición de tangente se obtiene tangente theta igual a a sobre g. Se conserva la ecuación vertical para recuperar T.</desc>
  <style>
    text { font-family: "Segoe UI", Arial, sans-serif; fill: #f4f6f8; letter-spacing: 0; }
    .math { font-family: "Cambria Math", Georgia, serif; }
    .muted { fill: #b5bdc8; }
    .tension { fill: #76b5ff; }
    .mass { fill: #ffd071; }
    .fraction { stroke: #f4f6f8; stroke-width: 2; }
    .cancel { stroke: #ff8588; stroke-width: 3; stroke-linecap: round; }
  </style>

  <rect width="920" height="730" fill="#17191e"/>
  <text x="40" y="51" font-size="30" font-weight="700">Dividir permite eliminar factores comunes</text>
  <text x="40" y="84" class="muted" font-size="18">El denominador elegido es T cos θ = mg &gt; 0.</text>
  <line x1="40" y1="104" x2="880" y2="104" stroke="#434851"/>

  <text x="56" y="137" font-size="20" font-weight="700">1. Partimos de las dos ecuaciones de Newton</text>
  <text x="76" y="184" class="muted" font-size="20">(1)</text>
  <text x="125" y="184" class="math tension" font-size="30">T</text>
  <text x="154" y="184" class="math" font-size="30">sin θ =</text>
  <text x="259" y="184" class="math mass" font-size="30">m</text>
  <text x="290" y="184" class="math" font-size="30">a</text>
  <text x="472" y="184" class="muted" font-size="20">(2)</text>
  <text x="521" y="184" class="math tension" font-size="30">T</text>
  <text x="550" y="184" class="math" font-size="30">cos θ =</text>
  <text x="663" y="184" class="math mass" font-size="30">m</text>
  <text x="694" y="184" class="math" font-size="30">g</text>
  <line x1="40" y1="215" x2="880" y2="215" stroke="#434851"/>

  <text x="56" y="250" font-size="20" font-weight="700">2. Dividimos (1) por (2) y cancelamos T y m</text>
  <text x="155" y="304" class="math tension" font-size="34">T</text>
  <text x="191" y="304" class="math" font-size="34">sin θ</text>
  <line x1="136" y1="326" x2="328" y2="326" class="fraction"/>
  <text x="155" y="367" class="math tension" font-size="34">T</text>
  <text x="191" y="367" class="math" font-size="34">cos θ</text>
  <line x1="152" y1="305" x2="178" y2="280" class="cancel"/>
  <line x1="152" y1="368" x2="178" y2="343" class="cancel"/>

  <text x="425" y="340" class="math" font-size="34">=</text>
  <text x="545" y="304" class="math mass" font-size="34">m</text>
  <text x="585" y="304" class="math" font-size="34">a</text>
  <line x1="528" y1="326" x2="635" y2="326" class="fraction"/>
  <text x="545" y="367" class="math mass" font-size="34">m</text>
  <text x="585" y="367" class="math" font-size="34">g</text>
  <line x1="542" y1="305" x2="576" y2="280" class="cancel"/>
  <line x1="542" y1="368" x2="576" y2="343" class="cancel"/>
  <text x="724" y="308" class="math tension" font-size="24">T ≠ 0</text>
  <text x="724" y="347" class="math mass" font-size="24">m ≠ 0</text>
  <line x1="40" y1="397" x2="880" y2="397" stroke="#434851"/>

  <text x="56" y="432" font-size="20" font-weight="700">3. Reconocemos la razón trigonométrica</text>
  <text x="152" y="482" class="math" font-size="32">sin θ</text>
  <line x1="133" y1="503" x2="253" y2="503" class="fraction"/>
  <text x="148" y="541" class="math" font-size="32">cos θ</text>
  <text x="302" y="516" class="math" font-size="32">=</text>
  <text x="386" y="482" class="math" font-size="32">a</text>
  <line x1="373" y1="503" x2="418" y2="503" class="fraction"/>
  <text x="385" y="541" class="math" font-size="32">g</text>
  <text x="458" y="516" class="muted" font-size="30">⇒</text>
  <text x="525" y="516" class="math" font-size="36">tan θ = a / g</text>
  <line x1="40" y1="570" x2="880" y2="570" stroke="#434851"/>

  <text x="56" y="605" font-size="20" font-weight="700">4. Despejamos la aceleración o el ángulo</text>
  <text x="76" y="653" class="math" font-size="30">a = g tan θ</text>
  <text x="472" y="653" class="math" font-size="30">θ = arctan(a / g)</text>
  <text x="56" y="704" class="muted" font-size="18">Para hallar T, conservamos (2): T = mg / cos θ.</text>
</svg>
