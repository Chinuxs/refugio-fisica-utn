<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" role="img" aria-labelledby="title description">
  <title id="title">Equilibrio en un eje y aceleración en otro</title>
  <desc id="description">Un cuerpo tiene fuerzas verticales equilibradas y una fuerza neta horizontal. La aceleración vertical es cero y la velocidad vertical permanece constante, mientras existe aceleración horizontal.</desc>
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#242830"/><stop offset="1" stop-color="#181b20"/></linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.28"/></filter>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 Z" fill="#4b93ff"/></marker>
    <marker id="arrowGold" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 Z" fill="#f5c451"/></marker>
    <style>.ui{font-family:Inter,"Segoe UI",Arial,sans-serif}.math{font-family:"Cambria Math","STIX Two Math",Georgia,serif}.muted{fill:#aab1bd}.bright{fill:#f7f9fc}.blue{fill:#4b93ff}.gold{fill:#f5c451}</style>
  </defs>
  <rect x="24" y="24" width="952" height="492" rx="28" fill="url(#surface)" stroke="#444b57" filter="url(#shadow)"/><line x1="500" y1="88" x2="500" y2="476" stroke="#444b57"/>
  <g class="ui">
    <text x="62" y="72" class="muted" font-size="18" font-weight="700" letter-spacing="1.5">UN MISMO PROBLEMA · DOS ECUACIONES</text>
    <text x="62" y="118" class="bright" font-size="18" font-weight="700">DCL Y EJES</text>
    <circle cx="250" cy="270" r="28" fill="#2d323a" stroke="#f7f9fc" stroke-width="2"/>
    <line x1="250" y1="242" x2="250" y2="142" stroke="#4b93ff" stroke-width="5" marker-end="url(#arrowBlue)"/><text x="268" y="170" class="blue" font-size="18">Fᵧ↑</text>
    <line x1="250" y1="298" x2="250" y2="398" stroke="#f5c451" stroke-width="5" marker-end="url(#arrowGold)"/><text x="268" y="382" class="gold" font-size="18">Fᵧ↓</text>
    <line x1="278" y1="270" x2="414" y2="270" stroke="#4b93ff" stroke-width="6" marker-end="url(#arrowBlue)"/><text x="326" y="248" class="blue" font-size="18">ΣFₓ</text>
    <line x1="96" y1="430" x2="96" y2="350" stroke="#aab1bd" stroke-width="3" marker-end="url(#arrowBlue)"/><text x="78" y="338" class="muted" font-size="16">+y</text>
    <line x1="96" y1="430" x2="176" y2="430" stroke="#aab1bd" stroke-width="3" marker-end="url(#arrowBlue)"/><text x="184" y="436" class="muted" font-size="16">+x</text>
    <rect x="62" y="448" width="386" height="42" rx="12" fill="#17345c" stroke="#4b93ff"/><text x="108" y="476" class="math bright" font-size="21">ΣFᵧ = 0 · ΣFₓ = maₓ</text>

    <text x="540" y="118" class="bright" font-size="18" font-weight="700">LEER aᵧ = 0</text>
    <rect x="540" y="146" width="396" height="76" rx="16" fill="#2d323a"/><text x="574" y="178" class="math gold" font-size="23">aᵧ = dvᵧ/dt = 0</text><text x="574" y="207" class="bright" font-size="18">→ vᵧ es constante</text>
    <line x1="738" y1="222" x2="738" y2="268" stroke="#4b93ff" stroke-width="4"/>
    <path d="M738 268 H622 V304" fill="none" stroke="#4b93ff" stroke-width="4" marker-end="url(#arrowBlue)"/><path d="M738 268 H854 V304" fill="none" stroke="#4b93ff" stroke-width="4" marker-end="url(#arrowBlue)"/>
    <rect x="540" y="320" width="188" height="104" rx="16" fill="#17345c" stroke="#4b93ff"/><text x="568" y="352" class="math bright" font-size="20">si vᵧ = 0</text><text x="568" y="384" class="muted" font-size="16">altura constante</text><text x="568" y="408" class="muted" font-size="16">sin movimiento vertical</text>
    <rect x="748" y="320" width="188" height="104" rx="16" fill="#3a3020" stroke="#f5c451"/><text x="776" y="352" class="math bright" font-size="20">si vᵧ ≠ 0</text><text x="776" y="384" class="muted" font-size="16">movimiento vertical</text><text x="776" y="408" class="muted" font-size="16">con velocidad constante</text>
    <text x="566" y="468" class="gold" font-size="17" font-weight="700">Equilibrio en y no obliga a equilibrio en x.</text>
  </g>
</svg>
