<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="570" viewBox="0 0 1000 570" role="img" aria-labelledby="title description">
  <title id="title">Cómo cambian dirección y módulo de la aceleración</title>
  <desc id="description">Tres paneles muestran que la aceleración apunta como la fuerza neta, que con masa constante una fuerza neta mayor produce mayor aceleración y que, con la misma fuerza neta, una masa mayor produce menor aceleración.</desc>
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#242830"/><stop offset="1" stop-color="#181b20"/></linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.28"/></filter>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 Z" fill="#4b93ff"/></marker>
    <marker id="arrowGold" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 Z" fill="#f5c451"/></marker>
    <style>.ui{font-family:Inter,"Segoe UI",Arial,sans-serif}.math{font-family:"Cambria Math","STIX Two Math",Georgia,serif}.muted{fill:#aab1bd}.bright{fill:#f7f9fc}.blue{fill:#4b93ff}.gold{fill:#f5c451}</style>
  </defs>
  <rect x="24" y="24" width="952" height="522" rx="28" fill="url(#surface)" stroke="#444b57" filter="url(#shadow)"/>
  <line x1="333" y1="92" x2="333" y2="470" stroke="#444b57"/><line x1="666" y1="92" x2="666" y2="470" stroke="#444b57"/>
  <g class="ui">
    <text x="62" y="72" class="muted" font-size="18" font-weight="700" letter-spacing="1.5">SEGUNDA LEY · LEER LA PROPORCIÓN</text>
    <text x="62" y="120" class="bright" font-size="18" font-weight="700">DIRECCIÓN</text>
    <circle cx="160" cy="244" r="28" fill="#2d323a" stroke="#f7f9fc" stroke-width="2"/>
    <line x1="188" y1="224" x2="286" y2="224" stroke="#4b93ff" stroke-width="6" marker-end="url(#arrowBlue)"/>
    <text x="204" y="205" class="blue" font-size="18" font-weight="700">ΣF</text>
    <line x1="188" y1="270" x2="286" y2="270" stroke="#f5c451" stroke-width="4" stroke-dasharray="7 7" marker-end="url(#arrowGold)"/>
    <text x="204" y="301" class="gold" font-size="18" font-weight="700">a</text>
    <text x="62" y="360" class="bright" font-size="18">ΣF y a apuntan igual</text>
    <text x="62" y="392" class="muted" font-size="15">a se dibuja separada del DCL</text>

    <text x="365" y="120" class="bright" font-size="18" font-weight="700">MISMA MASA</text>
    <rect x="390" y="186" width="72" height="58" rx="10" fill="#2d323a" stroke="#f7f9fc"/><text x="416" y="222" class="bright" font-size="18">m</text>
    <line x1="462" y1="215" x2="532" y2="215" stroke="#4b93ff" stroke-width="5" marker-end="url(#arrowBlue)"/><text x="480" y="195" class="blue" font-size="16">F</text>
    <line x1="462" y1="265" x2="532" y2="265" stroke="#f5c451" stroke-width="3" marker-end="url(#arrowGold)"/><text x="480" y="291" class="gold" font-size="16">a</text>
    <rect x="390" y="330" width="72" height="58" rx="10" fill="#2d323a" stroke="#f7f9fc"/><text x="416" y="366" class="bright" font-size="18">m</text>
    <line x1="462" y1="350" x2="610" y2="350" stroke="#4b93ff" stroke-width="7" marker-end="url(#arrowBlue)"/><text x="508" y="330" class="blue" font-size="16">2F</text>
    <line x1="462" y1="405" x2="610" y2="405" stroke="#f5c451" stroke-width="4" marker-end="url(#arrowGold)"/><text x="508" y="435" class="gold" font-size="16">2a</text>

    <text x="698" y="120" class="bright" font-size="18" font-weight="700">MISMA FUERZA NETA</text>
    <rect x="714" y="186" width="72" height="58" rx="10" fill="#2d323a" stroke="#f7f9fc"/><text x="740" y="222" class="bright" font-size="18">m</text>
    <line x1="786" y1="215" x2="900" y2="215" stroke="#4b93ff" stroke-width="5" marker-end="url(#arrowBlue)"/><text x="824" y="195" class="blue" font-size="16">F</text>
    <line x1="786" y1="265" x2="900" y2="265" stroke="#f5c451" stroke-width="4" marker-end="url(#arrowGold)"/><text x="824" y="291" class="gold" font-size="16">a</text>
    <rect x="714" y="330" width="96" height="58" rx="10" fill="#2d323a" stroke="#f7f9fc"/><text x="742" y="366" class="bright" font-size="18">2m</text>
    <line x1="810" y1="350" x2="924" y2="350" stroke="#4b93ff" stroke-width="5" marker-end="url(#arrowBlue)"/><text x="846" y="330" class="blue" font-size="16">F</text>
    <line x1="810" y1="405" x2="866" y2="405" stroke="#f5c451" stroke-width="3" marker-end="url(#arrowGold)"/><text x="824" y="435" class="gold" font-size="16">a/2</text>
    <rect x="62" y="484" width="874" height="38" rx="12" fill="#17345c" stroke="#4b93ff"/><text x="370" y="510" class="math bright" font-size="22">ΣF = ma</text>
  </g>
</svg>
