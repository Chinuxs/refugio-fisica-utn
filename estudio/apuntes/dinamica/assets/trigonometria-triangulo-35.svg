<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480" role="img" aria-labelledby="title description">
  <title id="title">Relaciones trigonométricas respecto de un ángulo de 35 grados</title>
  <desc id="description">Tarjeta visual que relaciona seno, coseno y tangente con los lados de un triángulo rectángulo. El ángulo de referencia de 35 grados está en el vértice inferior derecho; el cateto vertical es el opuesto y el horizontal es el adyacente.</desc>
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#242830"/>
      <stop offset="1" stop-color="#181b20"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
    <style>
      .ui { font-family: Inter, "Segoe UI", Arial, sans-serif; }
      .math { font-family: "Cambria Math", "STIX Two Math", Georgia, serif; }
      .muted { fill: #aab1bd; }
      .bright { fill: #f7f9fc; }
      .accent { fill: #4b93ff; }
      .gold { fill: #f5c451; }
      .line { stroke: #4b93ff; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    </style>
  </defs>

  <rect x="24" y="24" width="952" height="432" rx="28" fill="url(#surface)" stroke="#444b57" filter="url(#shadow)"/>
  <line x1="500" y1="24" x2="500" y2="456" stroke="#444b57"/>

  <g class="ui">
    <text x="64" y="76" class="muted" font-size="18" font-weight="700" letter-spacing="1.5">IDENTIDAD TRIGONOMÉTRICA</text>
    <text x="64" y="146" class="math bright" font-size="38" font-style="italic">tan(θ) = sin(θ) / cos(θ)</text>

    <rect x="64" y="188" width="386" height="92" rx="16" fill="#2d323a"/>
    <text x="88" y="222" class="muted" font-size="16">Para θ = 35°</text>
    <text x="88" y="258" class="math bright" font-size="25">tan(35°) = 0.574 / 0.819 ≈ 0.700</text>

    <text x="64" y="320" class="muted" font-size="16" font-weight="700" letter-spacing="1.2">LOS LADOS DAN LAS RAZONES</text>
    <rect x="64" y="336" width="386" height="34" rx="10" fill="#3a3020" stroke="#f5c451"/>
    <text x="84" y="359" class="math bright" font-size="18">sin 35° = O/H = 0.574</text>
    <rect x="64" y="378" width="386" height="34" rx="10" fill="#17345c" stroke="#4b93ff"/>
    <text x="84" y="401" class="math bright" font-size="18">cos 35° = A/H = 0.819</text>
    <text x="64" y="438" class="math bright" font-size="18">tan 35° = O/A = 0.700</text>
  </g>

  <g class="ui">
    <text x="540" y="76" class="muted" font-size="18" font-weight="700" letter-spacing="1.5">TRIÁNGULO RECTÁNGULO</text>
    <line x1="570" y1="370" x2="570" y2="125" stroke="#f5c451" stroke-width="4" stroke-linecap="round"/>
    <line x1="570" y1="370" x2="920" y2="370" stroke="#4b93ff" stroke-width="4" stroke-linecap="round"/>
    <line x1="570" y1="125" x2="920" y2="370" stroke="#f7f9fc" stroke-width="4" stroke-linecap="round"/>
    <path d="M570 338 L602 338 L602 370" class="line" stroke-width="3"/>
    <path d="M844 370 A76 76 0 0 1 858 326" stroke="#f5c451" stroke-width="3" fill="none"/>

    <circle cx="570" cy="125" r="8" fill="#4b93ff"/>
    <circle cx="920" cy="370" r="8" fill="#4b93ff"/>
    <text x="745" y="222" class="muted" font-size="16" text-anchor="middle" transform="rotate(35 745 222)">hipotenusa = <tspan class="bright" font-weight="700">1.00</tspan></text>
    <text x="584" y="252" class="gold" font-size="16">opuesto</text>
    <text x="584" y="276" class="gold" font-size="17" font-weight="700">0.57</text>
    <text x="714" y="404" class="accent" font-size="16">adyacente</text>
    <text x="802" y="404" class="accent" font-size="17" font-weight="700">0.82</text>
    <text x="852" y="350" fill="#f5c451" font-size="18" font-weight="700">θ = 35°</text>
  </g>
</svg>
