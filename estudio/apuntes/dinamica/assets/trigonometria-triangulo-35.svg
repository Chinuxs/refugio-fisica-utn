<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="640" viewBox="0 0 1120 640" role="img" aria-labelledby="title description">
  <title id="title">Relaciones trigonométricas en un triángulo rectángulo</title>
  <desc id="description">Diagrama didáctico de seno, coseno y tangente. El ángulo de referencia theta es de 35 grados. La hipotenusa mide 1, el cateto adyacente mide 0,82 y el cateto opuesto mide 0,57. También se indica cómo esta relación se aplica a componentes de fuerzas.</desc>
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#202733"/>
      <stop offset="1" stop-color="#111820"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
    <style>
      .ui { font-family: Inter, "Segoe UI", Arial, sans-serif; }
      .math { font-family: "Cambria Math", "STIX Two Math", Georgia, serif; }
      .muted { fill: #aeb7c4; }
      .text { fill: #f7f9fc; }
      .blue { fill: #6ea8ff; }
      .orange { fill: #ffb84d; }
      .green { fill: #59d58b; }
      .panel { fill: #202a36; stroke: #3f4a58; }
    </style>
  </defs>

  <rect x="24" y="24" width="1072" height="592" rx="22" fill="url(#surface)" stroke="#3f4a58" filter="url(#shadow)"/>
  <line x1="530" y1="72" x2="530" y2="568" stroke="#3f4a58" stroke-width="2"/>

  <g class="ui">
    <text x="62" y="78" class="muted" font-size="18" font-weight="700" letter-spacing="1.4">TRIGONOMETRÍA = COMPARAR LADOS</text>
    <text x="62" y="112" class="text" font-size="24" font-weight="800">Elegí θ antes de nombrar los catetos</text>

    <rect x="62" y="148" width="408" height="64" rx="10" fill="#172739" stroke="#35557a"/>
    <text x="88" y="188" class="math text" font-size="28">sin θ = O / H</text>
    <text x="300" y="188" class="green" font-size="18" font-weight="700">opuesto</text>

    <rect x="62" y="228" width="408" height="64" rx="10" fill="#2a2518" stroke="#7b5d24"/>
    <text x="88" y="268" class="math text" font-size="28">cos θ = A / H</text>
    <text x="300" y="268" class="orange" font-size="18" font-weight="700">adyacente</text>

    <rect x="62" y="308" width="408" height="64" rx="10" fill="#1c2b24" stroke="#3f7456"/>
    <text x="88" y="348" class="math text" font-size="28">tan θ = O / A</text>
    <text x="300" y="348" class="muted" font-size="18" font-weight="700">catetos</text>

    <rect x="62" y="402" width="408" height="170" rx="12" class="panel"/>
    <text x="88" y="438" class="text" font-size="21" font-weight="800">Aplicado a fuerzas</text>
    <text x="88" y="472" class="muted" font-size="17">Ángulo desde horizontal:</text>
    <text x="88" y="500" class="math text" font-size="20">F_x = F cos θ, F_y = F sin θ</text>
    <text x="88" y="532" class="muted" font-size="17">Ángulo desde vertical:</text>
    <text x="88" y="560" class="math text" font-size="20">F_y = F cos θ, F_x = F sin θ</text>
  </g>

  <g class="ui">
    <text x="582" y="78" class="muted" font-size="18" font-weight="700" letter-spacing="1.4">TRIÁNGULO RECTÁNGULO CON θ = 35°</text>

    <line x1="640" y1="470" x2="980" y2="470" stroke="#ffb84d" stroke-width="8" stroke-linecap="round"/>
    <line x1="980" y1="470" x2="980" y2="232" stroke="#59d58b" stroke-width="8" stroke-linecap="round"/>
    <line x1="640" y1="470" x2="980" y2="232" stroke="#6ea8ff" stroke-width="8" stroke-linecap="round"/>

    <circle cx="640" cy="470" r="8" fill="#f7f9fc"/>
    <circle cx="980" cy="470" r="8" fill="#f7f9fc"/>
    <circle cx="980" cy="232" r="8" fill="#f7f9fc"/>

    <path d="M955 470 L955 445 L980 445" fill="none" stroke="#aeb7c4" stroke-width="3"/>
    <path d="M710 470 A70 70 0 0 0 697 430" fill="none" stroke="#f7d36b" stroke-width="4"/>
    <text x="708" y="445" fill="#f7d36b" font-size="24" font-weight="800">θ</text>

    <text x="762" y="508" class="orange" font-size="20" font-weight="800">adyacente A = 0,82</text>
    <text x="812" y="356" class="green" font-size="20" font-weight="800">opuesto O = 0,57</text>
    <text x="760" y="318" class="blue" font-size="20" font-weight="800" transform="rotate(-35 760 318)">hipotenusa H = 1</text>
    <text x="724" y="424" fill="#f7d36b" font-size="20" font-weight="800">35°</text>

    <rect x="600" y="112" width="420" height="86" rx="12" fill="#202a36" stroke="#3f4a58"/>
    <text x="626" y="146" class="text" font-size="20" font-weight="800">Con H = 1</text>
    <text x="626" y="178" class="math green" font-size="23">O = sin 35° = 0,57</text>
    <text x="828" y="178" class="math orange" font-size="23">A = cos 35° = 0,82</text>

    <rect x="600" y="540" width="420" height="42" rx="8" fill="#202a36" stroke="#3f4a58"/>
    <text x="624" y="567" class="text" font-size="17">Si cambiás θ, cambian “opuesto” y “adyacente”.</text>
  </g>
</svg>
