<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" role="img" aria-labelledby="title description">
  <title id="title">División de ecuaciones en una masa suspendida dentro de un automóvil acelerado</title>
  <desc id="description">Diagrama de una masa inclinada por la aceleración y simplificación visual de las ecuaciones de fuerza.</desc>
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#242830"/>
      <stop offset="1" stop-color="#181b20"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 Z" fill="#4b93ff"/>
    </marker>
    <marker id="arrowGold" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 Z" fill="#f5c451"/>
    </marker>
    <style>
      .ui { font-family: Inter, "Segoe UI", Arial, sans-serif; }
      .math { font-family: "Cambria Math", "STIX Two Math", Georgia, serif; }
      .muted { fill: #aab1bd; }
      .bright { fill: #f7f9fc; }
      .blue { fill: #4b93ff; }
      .gold { fill: #f5c451; }
    </style>
  </defs>

  <rect x="24" y="24" width="952" height="472" rx="28" fill="url(#surface)" stroke="#444b57" filter="url(#shadow)"/>
  <line x1="430" y1="24" x2="430" y2="496" stroke="#444b57"/>

  <g class="ui">
    <text x="62" y="72" class="muted" font-size="18" font-weight="700" letter-spacing="1.5">ESQUEMA DE FUERZAS</text>
    <path d="M74 416 H388" stroke="#59616d" stroke-width="4"/>
    <path d="M116 416 V120 H352 V416" stroke="#59616d" stroke-width="4" fill="none"/>
    <line x1="234" y1="120" x2="292" y2="258" stroke="#f7f9fc" stroke-width="4"/>
    <circle cx="292" cy="258" r="24" fill="#4b93ff"/>

    <line x1="292" y1="258" x2="240" y2="136" stroke="#4b93ff" stroke-width="4" marker-end="url(#arrowBlue)"/>
    <text x="216" y="176" class="blue" font-size="20" font-weight="700">T</text>

    <line x1="292" y1="258" x2="292" y2="370" stroke="#f5c451" stroke-width="4" marker-end="url(#arrowGold)"/>
    <text x="306" y="346" class="gold" font-size="20" font-weight="700">mg</text>

    <path d="M234 174 A54 54 0 0 1 255 170" stroke="#f5c451" stroke-width="3" fill="none"/>
    <text x="258" y="176" class="gold" font-size="18" font-weight="700">θ</text>

    <line x1="80" y1="454" x2="182" y2="454" stroke="#4b93ff" stroke-width="4" marker-end="url(#arrowBlue)"/>
    <text x="194" y="461" class="bright" font-size="18" font-weight="700">aceleración a</text>
  </g>

  <g class="ui">
    <text x="470" y="72" class="muted" font-size="18" font-weight="700" letter-spacing="1.5">DIVIDIR MIEMBRO A MIEMBRO</text>

    <rect x="470" y="102" width="458" height="108" rx="16" fill="#2d323a"/>
    <text x="500" y="146" class="math bright" font-size="28">T sin(θ) = m a</text>
    <text x="500" y="188" class="math bright" font-size="28">T cos(θ) = m g</text>

    <text x="470" y="252" class="muted" font-size="16">FACTORES COMUNES</text>
    <rect x="470" y="272" width="458" height="78" rx="16" fill="#2d323a"/>
    <text x="500" y="321" class="math bright" font-size="29">T sin(θ) / T cos(θ) = m a / m g</text>
    <line x1="500" y1="310" x2="519" y2="310" stroke="#f05f68" stroke-width="3"/>
    <line x1="635" y1="310" x2="654" y2="310" stroke="#f05f68" stroke-width="3"/>
    <line x1="799" y1="310" x2="817" y2="310" stroke="#f05f68" stroke-width="3"/>
    <line x1="862" y1="310" x2="880" y2="310" stroke="#f05f68" stroke-width="3"/>

    <path d="M700 370 V402" stroke="#4b93ff" stroke-width="4" marker-end="url(#arrowBlue)"/>
    <rect x="536" y="410" width="328" height="58" rx="16" fill="#17345c" stroke="#4b93ff"/>
    <text x="578" y="449" class="math bright" font-size="31" font-style="italic">tan(θ) = a / g</text>
  </g>
</svg>
