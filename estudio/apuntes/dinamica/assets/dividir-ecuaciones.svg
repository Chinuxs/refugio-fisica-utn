<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="700" viewBox="0 0 1040 700" role="img" aria-labelledby="title description">
  <title id="title">Masa suspendida en un automóvil acelerado hacia la derecha</title>
  <desc id="description">La masa permanece detrás del soporte, sin oscilar respecto del automóvil. En el marco del suelo acelera hacia la derecha. El diagrama de cuerpo libre muestra tensión hacia arriba y hacia la derecha y peso hacia abajo. Las componentes discontinuas son proyecciones de la tensión, no fuerzas adicionales. El ángulo theta se mide desde la vertical.</desc>
  <defs>
    <marker id="arrow-axis" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1 1 L11 6 L1 11 Z" fill="#9da5b0"/>
    </marker>
    <marker id="arrow-tension" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto">
      <path d="M1 1 L17 9 L1 17 Z" fill="#76b5ff"/>
    </marker>
    <marker id="arrow-weight" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto">
      <path d="M1 1 L17 9 L1 17 Z" fill="#ffd071"/>
    </marker>
    <marker id="arrow-component" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto">
      <path d="M1 1 L13 7 L1 13 Z" fill="#76dfab"/>
    </marker>
    <style>
      text { font-family: "Segoe UI", Arial, sans-serif; fill: #f4f6f8; letter-spacing: 0; }
      .math { font-family: "Cambria Math", Georgia, serif; }
      .muted { fill: #b5bdc8; }
      .tension { fill: #76b5ff; }
      .weight { fill: #ffd071; }
      .component { fill: #76dfab; }
      .projection { stroke: #76dfab; stroke-width: 3; stroke-dasharray: 7 5; }
    </style>
  </defs>

  <rect width="1040" height="700" fill="#17191e"/>
  <text x="40" y="52" font-size="30" font-weight="700">Una masa quieta en el auto puede estar acelerando</text>
  <text x="40" y="86" class="muted" font-size="19">Marco del suelo · cuerda tensa · posición fija respecto del automóvil</text>
  <line x1="40" y1="104" x2="1000" y2="104" stroke="#434851"/>
  <line x1="500" y1="122" x2="500" y2="590" stroke="#434851"/>

  <text x="64" y="140" font-size="21" font-weight="700">Situación física</text>
  <path d="M68 434 V182 H426 V434 Z" fill="#22252c" stroke="#747d89" stroke-width="3"/>
  <line x1="68" y1="182" x2="426" y2="182" stroke="#b5bdc8" stroke-width="6"/>
  <text x="337" y="174" class="muted" font-size="17">soporte</text>
  <line x1="318" y1="182" x2="318" y2="369" stroke="#747d89" stroke-width="2" stroke-dasharray="6 6"/>
  <line x1="318" y1="182" x2="228" y2="332" stroke="#f4f6f8" stroke-width="4"/>
  <circle cx="318" cy="182" r="6" fill="#f4f6f8"/>
  <circle cx="228" cy="332" r="19" fill="#76b5ff" stroke="#dcecff" stroke-width="2"/>
  <text x="194" y="378" class="tension math" font-size="24">m</text>
  <path d="M318 240 A58 58 0 0 1 288.16 231.74" fill="none" stroke="#ffd071" stroke-width="3"/>
  <text x="277" y="269" class="weight math" font-size="26">θ</text>
  <text x="337" y="306" class="muted" font-size="17">vertical</text>
  <line x1="68" y1="477" x2="248" y2="477" stroke="#76b5ff" stroke-width="5" marker-end="url(#arrow-tension)"/>
  <text x="268" y="484" class="tension math" font-size="24">a hacia +x</text>
  <text x="64" y="532" font-size="19">La masa queda detrás del soporte.</text>
  <text x="64" y="561" class="muted" font-size="18">No oscila: comparte la aceleración del auto.</text>

  <text x="544" y="140" font-size="21" font-weight="700">DCL: tensión y peso</text>
  <polygon points="670,360 670,180 778,180" fill="#222a2b"/>
  <line x1="620" y1="360" x2="946" y2="360" stroke="#9da5b0" stroke-width="1.5" marker-end="url(#arrow-axis)"/>
  <line x1="670" y1="550" x2="670" y2="166" stroke="#9da5b0" stroke-width="1.5" marker-end="url(#arrow-axis)"/>
  <text x="952" y="367" class="muted" font-size="19">+x</text>
  <text x="683" y="170" class="muted" font-size="19">+y</text>
  <line x1="670" y1="180" x2="778" y2="180" class="projection"/>
  <line x1="778" y1="180" x2="778" y2="360" class="projection"/>
  <path d="M670 202 H692 V180" fill="none" stroke="#b5bdc8" stroke-width="2"/>
  <line x1="670" y1="360" x2="778" y2="360" class="projection" marker-end="url(#arrow-component)"/>
  <line x1="670" y1="360" x2="670" y2="180" class="projection" marker-end="url(#arrow-component)"/>
  <line x1="670" y1="360" x2="778" y2="180" stroke="#76b5ff" stroke-width="6" marker-end="url(#arrow-tension)"/>
  <line x1="670" y1="360" x2="670" y2="540" stroke="#ffd071" stroke-width="6" marker-end="url(#arrow-weight)"/>
  <circle cx="670" cy="360" r="7" fill="#f4f6f8"/>
  <path d="M670 292 A68 68 0 0 1 704.99 301.69" fill="none" stroke="#ffd071" stroke-width="3"/>
  <text x="715" y="305" class="weight math" font-size="27">θ</text>
  <text x="755" y="268" class="tension math" font-size="30">T</text>
  <text x="644" y="250" text-anchor="end" class="component math" font-size="24">T<tspan baseline-shift="sub" font-size="16">y</tspan></text>
  <text x="710" y="395" class="component math" font-size="24">T<tspan baseline-shift="sub" font-size="16">x</tspan></text>
  <text x="699" y="490" class="weight math" font-size="25">P = mg</text>
  <text x="544" y="559" class="component" font-size="18">Líneas discontinuas: componentes de T.</text>
  <text x="544" y="584" class="muted" font-size="18">No son fuerzas adicionales.</text>

  <line x1="40" y1="608" x2="1000" y2="608" stroke="#434851"/>
  <text x="64" y="645" class="math" font-size="26">Horizontal: T sin θ = ma</text>
  <text x="544" y="645" class="math" font-size="26">Vertical: T cos θ = mg</text>
  <text x="64" y="680" class="muted" font-size="18">θ desde la vertical: coseno en y, seno en x. Aceleración horizontal a; vertical nula.</text>
</svg>
