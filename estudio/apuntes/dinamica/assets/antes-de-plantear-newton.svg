<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="720" viewBox="0 0 1000 720" role="img" aria-labelledby="title description">
  <title id="title">Decidir entre situación ordinaria, condición límite y cambio de régimen</title>
  <desc id="description">Árbol de decisión completo. Si el enunciado pide un máximo, mínimo o una situación a punto de ocurrir, se impone la condición límite correspondiente. Si no, se calcula la fuerza requerida. Luego se comprueba si tensión, normal y rozamiento son físicamente posibles; si lo son, el modelo es válido, y si no, debe cambiarse el modelo.</desc>
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#242830"/>
      <stop offset="1" stop-color="#181b20"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 Z" fill="#4b93ff"/>
    </marker>
    <marker id="arrowGold" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 Z" fill="#f5c451"/>
    </marker>
    <style>
      .ui { font-family: Inter, "Segoe UI", Arial, sans-serif; }
      .math { font-family: "Cambria Math", "STIX Two Math", Georgia, serif; }
      .muted { fill: #aab1bd; }
      .bright { fill: #f7f9fc; }
      .blue { fill: #4b93ff; }
      .gold { fill: #f5c451; }
      .red { fill: #f05f68; }
    </style>
  </defs>

  <rect x="24" y="24" width="952" height="672" rx="28" fill="url(#surface)" stroke="#444b57" filter="url(#shadow)"/>

  <g class="ui">
    <text x="62" y="72" class="muted" font-size="18" font-weight="700" letter-spacing="1.5">ANTES DE IMPONER UNA CONDICIÓN LÍMITE</text>

    <rect x="62" y="104" width="410" height="104" rx="20" fill="#2d323a" stroke="#59616d"/>
    <circle cx="94" cy="138" r="18" fill="#4b93ff"/>
    <text x="89" y="145" class="bright" font-size="18" font-weight="700">1</text>
    <text x="128" y="140" class="bright" font-size="19" font-weight="700">¿Pide máximo, mínimo</text>
    <text x="128" y="170" class="bright" font-size="19" font-weight="700">o dice “a punto de”?</text>

    <line x1="472" y1="156" x2="538" y2="156" stroke="#4b93ff" stroke-width="4" marker-end="url(#arrowBlue)"/>
    <text x="490" y="138" class="blue" font-size="15" font-weight="700">SÍ</text>
    <rect x="554" y="104" width="382" height="104" rx="20" fill="#17345c" stroke="#4b93ff"/>
    <text x="582" y="136" class="bright" font-size="18" font-weight="700">Imponer el caso límite</text>
    <text x="582" y="170" class="math gold" font-size="21">|fₛ| = μₛN · N = 0 · T = 0</text>
    <text x="582" y="194" class="muted" font-size="14">usar sólo la igualdad que corresponda</text>

    <line x1="267" y1="208" x2="267" y2="266" stroke="#4b93ff" stroke-width="4" marker-end="url(#arrowBlue)"/>
    <text x="281" y="244" class="blue" font-size="15" font-weight="700">NO</text>
    <rect x="62" y="282" width="410" height="106" rx="20" fill="#2d323a" stroke="#59616d"/>
    <text x="92" y="316" class="bright" font-size="18" font-weight="700">No forzar una igualdad límite</text>
    <text x="92" y="347" class="muted" font-size="16">Calcular lo requerido con Newton:</text>
    <text x="92" y="376" class="math blue" font-size="21">ΣF = ma  o  ΣF = 0</text>

    <path d="M745 208 V244 H500 V420" fill="none" stroke="#4b93ff" stroke-width="4" marker-end="url(#arrowBlue)"/>
    <path d="M267 388 V420" fill="none" stroke="#4b93ff" stroke-width="4"/>

    <rect x="208" y="436" width="584" height="100" rx="20" fill="#2d323a" stroke="#59616d"/>
    <circle cx="240" cy="470" r="18" fill="#4b93ff"/>
    <text x="235" y="477" class="bright" font-size="18" font-weight="700">2</text>
    <text x="274" y="470" class="bright" font-size="19" font-weight="700">¿El resultado es físicamente posible?</text>
    <text x="274" y="505" class="math muted" font-size="18">|fₛ| ≤ μₛN  ·  N ≥ 0  ·  T ≥ 0</text>

    <path d="M356 536 V578 H230 V600" fill="none" stroke="#4b93ff" stroke-width="4" marker-end="url(#arrowBlue)"/>
    <text x="278" y="572" class="blue" font-size="15" font-weight="700">SÍ</text>
    <path d="M644 536 V578 H770 V600" fill="none" stroke="#f5c451" stroke-width="4" marker-end="url(#arrowGold)"/>
    <text x="694" y="572" class="gold" font-size="15" font-weight="700">NO</text>

    <rect x="62" y="610" width="410" height="58" rx="16" fill="#17345c" stroke="#4b93ff"/>
    <text x="91" y="638" class="bright" font-size="18" font-weight="700">El régimen supuesto es válido</text>
    <text x="91" y="659" class="muted" font-size="14">si está quieto: a = 0 y equilibrio</text>

    <rect x="528" y="610" width="408" height="58" rx="16" fill="#3a3020" stroke="#f5c451"/>
    <text x="555" y="638" class="bright" font-size="18" font-weight="700">Cambiar el modelo y replantear</text>
    <text x="555" y="659" class="gold" font-size="14">desliza · pierde contacto · cuerda floja</text>
  </g>
</svg>
