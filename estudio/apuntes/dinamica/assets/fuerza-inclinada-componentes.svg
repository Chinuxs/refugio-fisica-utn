<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" role="img" aria-labelledby="title description">
  <title id="title">Componentes de una fuerza inclinada respecto de la vertical</title>
  <desc id="description">Una fuerza F forma un ángulo theta con el eje vertical. La componente vertical es el cateto adyacente F cos theta y la componente horizontal es el cateto opuesto F sin theta. Las componentes se muestran con líneas auxiliares discontinuas.</desc>
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#242830"/><stop offset="1" stop-color="#181b20"/></linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.28"/></filter>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 Z" fill="#4b93ff"/></marker>
    <style>.ui{font-family:Inter,"Segoe UI",Arial,sans-serif}.math{font-family:"Cambria Math","STIX Two Math",Georgia,serif}.muted{fill:#aab1bd}.bright{fill:#f7f9fc}.blue{fill:#4b93ff}.gold{fill:#f5c451}</style>
  </defs>
  <rect x="24" y="24" width="952" height="472" rx="28" fill="url(#surface)" stroke="#444b57" filter="url(#shadow)"/><line x1="520" y1="24" x2="520" y2="496" stroke="#444b57"/>
  <g class="ui">
    <text x="62" y="72" class="muted" font-size="18" font-weight="700" letter-spacing="1.5">PRIMERO: ¿DESDE QUÉ EJE SE MIDE θ?</text>
    <circle cx="268" cy="382" r="10" fill="#f7f9fc"/>
    <line x1="268" y1="382" x2="268" y2="112" stroke="#aab1bd" stroke-width="3" stroke-dasharray="8 8"/><text x="188" y="126" class="muted" font-size="16">vertical +y</text>
    <line x1="268" y1="382" x2="454" y2="382" stroke="#aab1bd" stroke-width="3" stroke-dasharray="8 8"/><text x="430" y="408" class="muted" font-size="16">+x</text>
    <line x1="268" y1="382" x2="430" y2="138" stroke="#4b93ff" stroke-width="7" marker-end="url(#arrowBlue)"/><text x="386" y="170" class="blue" font-size="22" font-weight="700">F</text>
    <line x1="430" y1="138" x2="268" y2="138" stroke="#f5c451" stroke-width="4" stroke-dasharray="7 7"/><text x="320" y="124" class="gold" font-size="17">Fₓ = F sin θ</text>
    <line x1="430" y1="138" x2="430" y2="382" stroke="#f5c451" stroke-width="4" stroke-dasharray="7 7"/><text x="442" y="270" class="gold" font-size="17" transform="rotate(-90 442 270)">Fᵧ = F cos θ</text>
    <path d="M268 196 A186 186 0 0 1 328 206" fill="none" stroke="#f5c451" stroke-width="3"/><text x="316" y="194" class="gold" font-size="20" font-weight="700">θ</text>
    <text x="62" y="446" class="bright" font-size="17" font-weight="700">adyacente a θ: vertical</text><text x="290" y="446" class="gold" font-size="17">· opuesto a θ: horizontal</text>

    <text x="560" y="72" class="muted" font-size="18" font-weight="700" letter-spacing="1.5">DESPUÉS: ESCRIBIR COMPONENTES</text>
    <rect x="560" y="108" width="376" height="96" rx="18" fill="#17345c" stroke="#4b93ff"/><text x="596" y="150" class="math bright" font-size="27">Fᵧ = F cos θ</text><text x="596" y="184" class="muted" font-size="16">cateto adyacente</text>
    <rect x="560" y="224" width="376" height="96" rx="18" fill="#3a3020" stroke="#f5c451"/><text x="596" y="266" class="math bright" font-size="27">Fₓ = F sin θ</text><text x="596" y="300" class="muted" font-size="16">cateto opuesto</text>
    <rect x="560" y="350" width="376" height="92" rx="18" fill="#2d323a" stroke="#59616d"/><text x="590" y="382" class="bright" font-size="17" font-weight="700">Los signos vienen al final</text><text x="590" y="412" class="muted" font-size="16">según el sentido de +x y +y.</text>
    <text x="574" y="474" class="gold" font-size="17" font-weight="700">Fₓ y Fᵧ no son fuerzas adicionales.</text>
  </g>
</svg>
