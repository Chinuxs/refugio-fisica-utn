<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="680" viewBox="0 0 1120 680" role="img" aria-labelledby="title description">
  <title id="title">Componentes de una fuerza inclinada con ángulo medido desde la vertical</title>
  <desc id="description">Diagrama de una fuerza F que forma un ángulo theta con el eje vertical. La componente vertical queda adyacente al ángulo y vale F cos theta. La componente horizontal queda opuesta al ángulo y vale F sin theta. El gráfico separa el cálculo de módulos de la asignación de signos.</desc>
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#202733"/>
      <stop offset="1" stop-color="#111820"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
    <marker id="arrow-axis" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 Z" fill="#9aa5b1"/>
    </marker>
    <marker id="arrow-force" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto">
      <path d="M0,0 L0,8 L11,4 Z" fill="#6ea8ff"/>
    </marker>
    <marker id="arrow-x" markerWidth="11" markerHeight="11" refX="9" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L10,3.5 Z" fill="#ffb84d"/>
    </marker>
    <marker id="arrow-y" markerWidth="11" markerHeight="11" refX="9" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L10,3.5 Z" fill="#59d58b"/>
    </marker>
    <style>
      .ui { font-family: Inter, "Segoe UI", Arial, sans-serif; }
      .math { font-family: "Cambria Math", "STIX Two Math", Georgia, serif; }
      .muted { fill: #aeb7c4; }
      .text { fill: #f7f9fc; }
      .force { fill: #6ea8ff; }
      .x { fill: #ffb84d; }
      .y { fill: #59d58b; }
      .soft { fill: #202a36; }
      .line-muted { stroke: #7f8a99; stroke-width: 2.5; stroke-dasharray: 8 8; }
    </style>
  </defs>

  <rect x="24" y="24" width="1072" height="632" rx="22" fill="url(#surface)" stroke="#3f4a58" filter="url(#shadow)"/>
  <line x1="536" y1="72" x2="536" y2="608" stroke="#3f4a58" stroke-width="2"/>

  <g class="ui">
    <text x="62" y="78" class="muted" font-size="18" font-weight="700" letter-spacing="1.4">ÁNGULO MEDIDO DESDE LA VERTICAL</text>
    <text x="62" y="108" class="text" font-size="21" font-weight="700">Componente pegada al ángulo:</text>
    <text x="62" y="134" class="y" font-size="21" font-weight="800">usa coseno</text>

    <line x1="260" y1="510" x2="486" y2="510" stroke="#9aa5b1" stroke-width="3" marker-end="url(#arrow-axis)"/>
    <line x1="260" y1="510" x2="260" y2="174" stroke="#9aa5b1" stroke-width="3" marker-end="url(#arrow-axis)"/>
    <text x="492" y="517" class="muted" font-size="18" font-weight="700">+x</text>
    <text x="238" y="168" class="muted" font-size="18" font-weight="700">+y</text>

    <polygon points="260,510 410,510 410,270" fill="#1a2430" stroke="#334255" stroke-width="2"/>
    <line x1="410" y1="270" x2="410" y2="510" class="line-muted"/>
    <line x1="260" y1="270" x2="410" y2="270" class="line-muted"/>

    <line x1="260" y1="510" x2="410" y2="510" stroke="#ffb84d" stroke-width="7" stroke-linecap="round" marker-end="url(#arrow-x)"/>
    <line x1="260" y1="510" x2="260" y2="270" stroke="#59d58b" stroke-width="7" stroke-linecap="round" marker-end="url(#arrow-y)"/>
    <line x1="260" y1="510" x2="410" y2="270" stroke="#6ea8ff" stroke-width="8" stroke-linecap="round" marker-end="url(#arrow-force)"/>

    <circle cx="260" cy="510" r="8" fill="#f7f9fc"/>
    <path d="M260 430 A80 80 0 0 1 302 442" fill="none" stroke="#f7d36b" stroke-width="4"/>
    <text x="307" y="432" fill="#f7d36b" font-size="26" font-weight="800">θ</text>

    <path d="M384 510 L384 484 L410 484" fill="none" stroke="#aeb7c4" stroke-width="3"/>
    <text x="346" y="372" class="force" font-size="30" font-weight="800">F</text>
    <text x="314" y="548" class="x math" font-size="24">F_x = F sin θ</text>
    <text x="82" y="392" class="y math" font-size="24">F_y = F cos θ</text>
    <text x="300" y="252" class="muted" font-size="16">proyección</text>
    <text x="420" y="392" class="muted" font-size="16" transform="rotate(-90 420 392)">proyección</text>

    <rect x="62" y="568" width="430" height="64" rx="8" fill="#202a36" stroke="#3f4a58"/>
    <text x="84" y="594" class="text" font-size="17">Primero módulos: seno/coseno.</text>
    <text x="84" y="618" class="text" font-size="17">Después signos: +x, -x, +y, -y.</text>
  </g>

  <g class="ui">
    <text x="584" y="78" class="muted" font-size="18" font-weight="700" letter-spacing="1.4">RECETA PARA NO CONFUNDIRSE</text>

    <rect x="584" y="112" width="454" height="122" rx="12" fill="#172739" stroke="#35557a"/>
    <text x="614" y="150" class="text" font-size="22" font-weight="800">Si θ sale de la vertical</text>
    <text x="614" y="188" class="math y" font-size="27">F_y = F cos θ</text>
    <text x="816" y="188" class="muted" font-size="17">adyacente</text>
    <text x="614" y="218" class="math x" font-size="27">F_x = F sin θ</text>
    <text x="816" y="218" class="muted" font-size="17">opuesto</text>

    <rect x="584" y="258" width="454" height="122" rx="12" fill="#2a2518" stroke="#7b5d24"/>
    <text x="614" y="296" class="text" font-size="22" font-weight="800">Si θ sale de la horizontal</text>
    <text x="614" y="334" class="math x" font-size="27">F_x = F cos θ</text>
    <text x="816" y="334" class="muted" font-size="17">adyacente</text>
    <text x="614" y="364" class="math y" font-size="27">F_y = F sin θ</text>
    <text x="816" y="364" class="muted" font-size="17">opuesto</text>

    <rect x="584" y="414" width="454" height="142" rx="12" fill="#202a36" stroke="#3f4a58"/>
    <text x="614" y="452" class="text" font-size="22" font-weight="800">Chequeo final</text>
    <text x="614" y="492" class="math text" font-size="26">F² = F_x² + F_y²</text>
    <text x="614" y="526" class="muted" font-size="17">La componente más grande queda sobre el eje</text>
    <text x="614" y="550" class="muted" font-size="17">más cercano a la dirección de la fuerza.</text>

    <text x="584" y="604" class="muted" font-size="17">Las componentes no son fuerzas extra:</text>
    <text x="584" y="628" class="muted" font-size="17">son la misma fuerza escrita en ejes.</text>
  </g>
</svg>
