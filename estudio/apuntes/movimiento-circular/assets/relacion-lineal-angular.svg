<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img" aria-labelledby="title description">
  <title id="title">Relación entre velocidad angular, velocidad tangencial y aceleración radial</title>
  <desc id="description">Dos puntos giran con la misma velocidad angular. El punto de mayor radio tiene mayor velocidad tangencial. La velocidad es tangente y la aceleración radial apunta al centro.</desc>
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#242830"/>
      <stop offset="1" stop-color="#181b20"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 Z" fill="#4b93ff"/>
    </marker>
    <marker id="arrowGold" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 Z" fill="#f5c451"/>
    </marker>
    <style>
      .ui { font-family: Inter, "Segoe UI", Arial, sans-serif; }
      .math { font-family: "Cambria Math", "STIX Two Math", Georgia, serif; }
      .muted { fill: #aab1bd; }
      .bright { fill: #f7f9fc; }
      .blue { fill: #4b93ff; }
      .gold { fill: #f5c451; }
    </style>
  </defs>

  <rect x="24" y="24" width="952" height="452" rx="28" fill="url(#surface)" stroke="#444b57" filter="url(#shadow)"/>
  <line x1="610" y1="24" x2="610" y2="476" stroke="#444b57"/>

  <g class="ui">
    <text x="62" y="72" class="muted" font-size="18" font-weight="700" letter-spacing="1.5">MISMA VELOCIDAD ANGULAR ω</text>
    <circle cx="290" cy="272" r="150" fill="none" stroke="#59616d" stroke-width="3" stroke-dasharray="8 10"/>
    <circle cx="290" cy="272" r="82" fill="none" stroke="#3c424c" stroke-width="2" stroke-dasharray="6 8"/>
    <circle cx="290" cy="272" r="9" fill="#f7f9fc"/>
    <text x="267" y="302" class="muted" font-size="16">centro</text>

    <line x1="290" y1="272" x2="440" y2="272" stroke="#aab1bd" stroke-width="3"/>
    <circle cx="372" cy="272" r="11" fill="#f5c451"/>
    <circle cx="440" cy="272" r="13" fill="#4b93ff"/>
    <text x="326" y="257" class="gold" font-size="17" font-weight="700">R₁</text>
    <text x="399" y="257" class="blue" font-size="17" font-weight="700">R₂</text>

    <line x1="372" y1="255" x2="372" y2="185" stroke="#f5c451" stroke-width="4" marker-end="url(#arrowGold)"/>
    <line x1="440" y1="251" x2="440" y2="105" stroke="#4b93ff" stroke-width="5" marker-end="url(#arrowBlue)"/>
    <text x="386" y="196" class="gold" font-size="18" font-weight="700">vₜ₁</text>
    <text x="455" y="120" class="blue" font-size="18" font-weight="700">vₜ₂</text>

    <path d="M190 182 A125 125 0 0 1 282 147" fill="none" stroke="#4b93ff" stroke-width="4" marker-end="url(#arrowBlue)"/>
    <text x="198" y="154" class="blue" font-size="18" font-weight="700">sentido de giro</text>

    <line x1="438" y1="292" x2="332" y2="292" stroke="#f5c451" stroke-width="4" marker-end="url(#arrowGold)"/>
    <text x="369" y="324" class="gold" font-size="18" font-weight="700">aᵣ hacia el centro</text>
  </g>

  <g class="ui">
    <text x="650" y="72" class="muted" font-size="18" font-weight="700" letter-spacing="1.5">RELACIONES CLAVE</text>
    <rect x="650" y="104" width="286" height="78" rx="16" fill="#17345c" stroke="#4b93ff"/>
    <text x="713" y="154" class="math bright" font-size="35" font-style="italic">vₜ = ω R</text>

    <text x="650" y="236" class="bright" font-size="22" font-weight="700">Si ω es la misma:</text>
    <text x="674" y="281" class="blue" font-size="22" font-weight="700">R₂ &gt; R₁</text>
    <text x="795" y="281" class="bright" font-size="22">→</text>
    <text x="832" y="281" class="blue" font-size="22" font-weight="700">vₜ₂ &gt; vₜ₁</text>

    <rect x="650" y="322" width="286" height="104" rx="16" fill="#2d323a"/>
    <text x="674" y="359" class="muted" font-size="17">En cada punto</text>
    <text x="674" y="393" class="bright" font-size="19" font-weight="700">vₜ ⟂ R</text>
    <text x="796" y="393" class="gold" font-size="19" font-weight="700">aᵣ → centro</text>
  </g>
</svg>
