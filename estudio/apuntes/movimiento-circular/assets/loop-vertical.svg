<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" role="img" aria-labelledby="title description">
  <title id="title">Fuerzas y signos en un loop vertical</title>
  <desc id="description">Comparación del punto alto y el punto bajo de un cuerpo dentro de un loop. Se muestran la normal, el peso, la dirección hacia el centro y las ecuaciones radiales.</desc>
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#242830"/>
      <stop offset="1" stop-color="#181b20"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 Z" fill="#4b93ff"/>
    </marker>
    <marker id="arrowGold" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 Z" fill="#f5c451"/>
    </marker>
    <style>
      .ui { font-family: Inter, "Segoe UI", Arial, sans-serif; }
      .math { font-family: "Cambria Math", "STIX Two Math", Georgia, serif; }
      .muted { fill: #aab1bd; }
      .bright { fill: #f7f9fc; }
      .blue { fill: #4b93ff; }
      .gold { fill: #f5c451; }
    </style>
  </defs>

  <rect x="24" y="24" width="952" height="472" rx="28" fill="url(#surface)" stroke="#444b57" filter="url(#shadow)"/>
  <line x1="500" y1="24" x2="500" y2="496" stroke="#444b57"/>

  <g class="ui">
    <text x="62" y="72" class="muted" font-size="18" font-weight="700" letter-spacing="1.5">CUERPO DENTRO DEL LOOP</text>
    <circle cx="260" cy="272" r="145" fill="none" stroke="#59616d" stroke-width="14"/>
    <circle cx="260" cy="272" r="9" fill="#f7f9fc"/>
    <text x="275" y="279" class="muted" font-size="17">centro</text>

    <circle cx="260" cy="127" r="20" fill="#4b93ff"/>
    <text x="185" y="112" class="bright" font-size="18" font-weight="700">punto alto</text>
    <line x1="245" y1="145" x2="245" y2="224" stroke="#4b93ff" stroke-width="4" marker-end="url(#arrowBlue)"/>
    <line x1="277" y1="145" x2="277" y2="224" stroke="#f5c451" stroke-width="4" marker-end="url(#arrowGold)"/>
    <text x="218" y="190" class="blue" font-size="18" font-weight="700">N</text>
    <text x="290" y="190" class="gold" font-size="18" font-weight="700">mg</text>

    <circle cx="260" cy="417" r="20" fill="#4b93ff"/>
    <text x="181" y="461" class="bright" font-size="18" font-weight="700">punto bajo</text>
    <line x1="245" y1="397" x2="245" y2="316" stroke="#4b93ff" stroke-width="4" marker-end="url(#arrowBlue)"/>
    <line x1="277" y1="437" x2="277" y2="482" stroke="#f5c451" stroke-width="4" marker-end="url(#arrowGold)"/>
    <text x="218" y="364" class="blue" font-size="18" font-weight="700">N</text>
    <text x="290" y="476" class="gold" font-size="18" font-weight="700">mg</text>

    <rect x="60" y="214" width="120" height="70" rx="14" fill="#17345c" stroke="#4b93ff"/>
    <text x="80" y="242" class="muted" font-size="15">positivo radial</text>
    <text x="80" y="270" class="bright" font-size="17" font-weight="700">hacia O</text>
  </g>

  <g class="ui">
    <text x="540" y="72" class="muted" font-size="18" font-weight="700" letter-spacing="1.5">ECUACIONES RADIALES</text>
    <rect x="540" y="104" width="396" height="112" rx="16" fill="#2d323a"/>
    <text x="568" y="142" class="blue" font-size="18" font-weight="700">ARRIBA · centro hacia abajo</text>
    <text x="568" y="187" class="math bright" font-size="27">N + mg = m v² / R</text>

    <rect x="540" y="238" width="396" height="112" rx="16" fill="#2d323a"/>
    <text x="568" y="276" class="blue" font-size="18" font-weight="700">ABAJO · centro hacia arriba</text>
    <text x="568" y="321" class="math bright" font-size="27">N − mg = m v² / R</text>

    <rect x="540" y="374" width="396" height="82" rx="16" fill="#3a3020" stroke="#f5c451"/>
    <text x="568" y="407" class="gold" font-size="17" font-weight="700">CONTACTO LÍMITE ARRIBA · N = 0</text>
    <text x="660" y="442" class="math bright" font-size="25">vₘᵢₙ = √(gR)</text>
  </g>
</svg>
