<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="570" viewBox="0 0 1000 570" role="img" aria-labelledby="title description">
  <title id="title">Comparación entre el punto alto de un loop y una cima convexa</title>
  <desc id="description">En ambas situaciones el centro está debajo del cuerpo. Dentro del loop, la normal y el peso apuntan hacia el centro. Sobre una cima convexa, el peso apunta hacia el centro pero la normal se opone. Se muestran las ecuaciones radiales y la condición de contacto.</desc>
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#242830"/>
      <stop offset="1" stop-color="#181b20"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 Z" fill="#4b93ff"/>
    </marker>
    <marker id="arrowGold" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 Z" fill="#f5c451"/>
    </marker>
    <style>
      .ui { font-family: Inter, "Segoe UI", Arial, sans-serif; }
      .math { font-family: "Cambria Math", "STIX Two Math", Georgia, serif; }
      .muted { fill: #aab1bd; }
      .bright { fill: #f7f9fc; }
      .blue { fill: #4b93ff; }
      .gold { fill: #f5c451; }
    </style>
  </defs>

  <rect x="24" y="24" width="952" height="522" rx="28" fill="url(#surface)" stroke="#444b57" filter="url(#shadow)"/>
  <line x1="500" y1="86" x2="500" y2="510" stroke="#444b57"/>

  <g class="ui">
    <text x="62" y="72" class="muted" font-size="18" font-weight="700" letter-spacing="1.5">MISMO CENTRO HACIA ABAJO · LA NORMAL CAMBIA</text>

    <text x="62" y="116" class="bright" font-size="18" font-weight="700">DENTRO DEL LOOP · punto alto</text>
    <path d="M110 320 A140 140 0 0 1 390 320" fill="none" stroke="#59616d" stroke-width="14"/>
    <circle cx="250" cy="210" r="22" fill="#4b93ff"/>
    <circle cx="250" cy="320" r="7" fill="#f7f9fc"/>
    <text x="266" y="326" class="muted" font-size="15">centro</text>
    <line x1="236" y1="232" x2="236" y2="292" stroke="#4b93ff" stroke-width="5" marker-end="url(#arrowBlue)"/>
    <text x="207" y="270" class="blue" font-size="19" font-weight="700">N</text>
    <line x1="266" y1="232" x2="266" y2="292" stroke="#f5c451" stroke-width="5" marker-end="url(#arrowGold)"/>
    <text x="280" y="270" class="gold" font-size="19" font-weight="700">mg</text>
    <line x1="116" y1="194" x2="116" y2="270" stroke="#4b93ff" stroke-width="3" stroke-dasharray="7 7" marker-end="url(#arrowBlue)"/>
    <text x="77" y="184" class="blue" font-size="16" font-weight="700">+r</text>
    <rect x="62" y="386" width="386" height="62" rx="16" fill="#17345c" stroke="#4b93ff"/>
    <text x="108" y="425" class="math bright" font-size="25">N + mg = m v²/R</text>
    <text x="78" y="483" class="gold" font-size="16" font-weight="700">Contacto mínimo arriba:</text>
    <text x="265" y="483" class="math bright" font-size="19">N = 0  →  vₘᵢₙ = √(gR)</text>

    <text x="540" y="116" class="bright" font-size="18" font-weight="700">CIMA CONVEXA</text>
    <path d="M590 350 A160 160 0 0 1 910 350" fill="none" stroke="#59616d" stroke-width="14"/>
    <circle cx="750" cy="160" r="22" fill="#4b93ff"/>
    <circle cx="750" cy="350" r="7" fill="#f7f9fc"/>
    <text x="766" y="356" class="muted" font-size="15">centro</text>
    <line x1="736" y1="138" x2="736" y2="88" stroke="#4b93ff" stroke-width="5" marker-end="url(#arrowBlue)"/>
    <text x="705" y="96" class="blue" font-size="19" font-weight="700">N</text>
    <line x1="766" y1="182" x2="766" y2="302" stroke="#f5c451" stroke-width="5" marker-end="url(#arrowGold)"/>
    <text x="780" y="262" class="gold" font-size="19" font-weight="700">mg</text>
    <line x1="616" y1="150" x2="616" y2="270" stroke="#4b93ff" stroke-width="3" stroke-dasharray="7 7" marker-end="url(#arrowBlue)"/>
    <text x="577" y="140" class="blue" font-size="16" font-weight="700">+r</text>
    <rect x="540" y="386" width="396" height="62" rx="16" fill="#3a3020" stroke="#f5c451"/>
    <text x="587" y="425" class="math bright" font-size="25">mg − N = m v²/R</text>
    <text x="556" y="483" class="gold" font-size="16" font-weight="700">Máximo con contacto:</text>
    <text x="746" y="483" class="math bright" font-size="19">N = 0  →  vₘáₓ = √(gR)</text>

    <text x="224" y="521" class="muted" font-size="17">No memorizar signos:</text>
    <text x="398" y="521" class="bright" font-size="17" font-weight="700">mirar de qué lado de la superficie está el cuerpo.</text>
  </g>
</svg>
